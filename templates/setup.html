{% extends "layout.html" %}

{% block content %}

<style>
  .setup-buttons {
    display: flex;
    gap: 15px;
    margin: 30px;
  }

  .setup-buttons a {
    text-decoration: none;
  }

  .setup-buttons button {
    padding: 12px 22px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid #333;
    background-color: #f2f2f2;
    transition: all 0.25s ease;
  }

  .setup-buttons button:hover {
    background-color: #222;
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
  }

  .setup-buttons button:active {
    transform: translateY(0);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
  }
</style>

<h2>Setup</h2>

<div class="setup-buttons">
  <a href="{{ url_for('pipe_size_setup') }}">
    <button type="button">Pipe Size Setup</button>
  </a>

  <a href="{{ url_for('thickness_size_setup') }}">
    <button type="button">Thickness Size Setup</button>
  </a>

  <a href="{{ url_for('strip_size_setup') }}">
    <button type="button">Strip Size Setup</button>
  </a>
</div>

{% endblock %}
