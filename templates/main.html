{% extends "layout.html" %}
{% block extra_styles %}
<style>

.page-container {
    padding: 20px;
}

/* ---------- GRN FORM LAYOUT ---------- */

.form-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px;
}

.section {
    background-color: #333;
    padding: 15px;
    border-radius: 8px;
    min-width: 300px;
    flex: 1;
}

.form-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
}

.form-row label {
    width: 130px;
    margin-right: 10px;
    font-weight: bold;
}

.form-row input,
.form-row textarea,
.form-row select {
    flex: 1;
    background-color: #1c1c1c;
    border: none;
    color: white;
    padding: 6px;
    border-radius: 4px;
}

textarea { resize: none; height: 80px; }

.manage-btn {
    background-color: #555;
    color: yellow;
    border: none;
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
}

.submit-btn {
    background-color: white;
    color: red;
    font-weight: bold;
    width: 120px;
}

.clear-btn {
    background-color: #ccc;
    color: black;
    font-weight: bold;
    width: 120px;
}

/* ---------- TABLE ---------- */

.table-container {
    margin-top: 25px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background-color: #1e1e1e;
    border-radius: 8px;
    overflow: hidden;
}

th, td {
    padding: 10px;
    border: 1px solid #444;
    font-size: 14px;
}

th {
    background-color: #444;
    color: #f1e60d;
}

/* ---------- POPUP MODAL ---------- */

#modalOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 2000;
}

#manageModal {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #222;
    padding: 20px;
    width: 350px;
    border-radius: 10px;
    border: 1px solid #666;
    z-index: 3000;
    color: white;
}

#modalList div {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
}

#modalList button {
    margin-left: 6px;
}

</style>
{% endblock %}


{% block content %}
<div class="page-container">

<h2>GRN:</h2>

<form method="POST" action="/submit">
    <div class="form-container">

        <!-- -------- SECTION 1 -------- -->
        <div class="section">

            <div class="form-row">
                <label>Tm No:</label>
                <input type="text" name="JobNumber">
            </div>

            <div class="form-row">
                <label>Supplier Code:</label>
                <input type="text" name="SupplierCode">
            </div>

            <div class="form-row">
                <label>Broker Code:</label>
                <input type="text" name="BrokerCode">
            </div>

            <div class="form-row">
                <label>Comments:</label>
                <textarea name="Comments"></textarea>
            </div>

        </div>

        <!-- -------- SECTION 2 -------- -->
        <div class="section">

            <div class="form-row">
                <label>Hardness:</label>
                <input type="text" name="Hardness">
            </div>

            <div class="form-row">
                <label>Weight:</label>
                <input type="text" name="Weight">
            </div>

            <div class="form-row">
                <label>Grade:</label>
                <select id="Grade" name="Grade">
                    <option disabled selected>Select Grade</option>
                    <option>SPCC</option>
                    <option>HARD</option>
                    {% for g in grades %}
                        <option>{{ g.value }}</option>
                    {% endfor %}
                    <option value="__add_new__">+ Add New</option>
                </select>
                <button type="button" class="manage-btn" onclick="openManageModal('grade')">⚙</button>
            </div>

            <div class="form-row">
                <label>Item Code:</label>
                <input type="text" name="itemcode">
            </div>

            <div class="form-row">
                <label>UOM:</label>
                <input type="text" name="UOM">
            </div>

            <div class="form-row">
                <label>Batch No:</label>
                <input type="text" name="BatchNo">
            </div>

            <input type="hidden" id="serial_num" name="serial_num">

        </div>

        <!-- -------- SECTION 3 -------- -->
        <div class="section">

            <div class="form-row">
                <label>Manuf code:</label>
                <input type="text" name="manufcode">
            </div>

            <div class="form-row">
                <label>DC No:</label>
                <input type="text" name="DC">
            </div>

            <div class="form-row">
                <label>Coil Type:</label>
                <select id="coil" name="coil">
                    <option disabled selected>Select Coil Type</option>
                    <option>CRC</option>
                    <option>HRC</option>
                    <option>GI</option>
                    {% for c in coil_types %}
                        <option>{{ c.value }}</option>
                    {% endfor %}
                    <option value="__add_new__">+ Add New</option>
                </select>
                <button type="button" class="manage-btn" onclick="openManageModal('coil')">⚙</button>
            </div>

            <div class="form-row">
                <label>Supplier:</label>
                <select id="supplier" name="supplier">
                    <option disabled selected>Select Supplier</option>
                    <option>AISHA STEEL LTD</option>
                    <option>GUL DEEWAN</option>
                    <option>CHINA</option>
                    {% for s in suppliers %}
                        <option>{{ s.value }}</option>
                    {% endfor %}
                    <option value="__add_new__">+ Add New</option>
                </select>
                <button type="button" class="manage-btn" onclick="openManageModal('supplier')">⚙</button>
            </div>

            <div class="form-row">
                <label>Item Desc:</label>
                <select id="ItemDesc" name="ItemDesc">
                    <option disabled selected>Select Item Desc</option>
                    <option>CRC</option>
                    <option>HRC</option>
                    <option>GI</option>
                    {% for d in item_descs %}
                        <option>{{ d.value }}</option>
                    {% endfor %}
                    <option value="__add_new__">+ Add New</option>
                </select>
                <button type="button" class="manage-btn" onclick="openManageModal('itemdesc')">⚙</button>
            </div>

        </div>

        <!-- -------- SECTION 4 -------- -->
        <div class="section">
            <button type="submit" class="submit-btn">Submit</button><br><br>
            <button type="reset" class="clear-btn">Clear</button>
        </div>

    </div>
</form>

</div>

<!-- ---------- MODAL + OVERLAY ---------- -->
<div id="modalOverlay"></div>

<div id="manageModal">
    <h3 id="modalTitle">Manage</h3>
    <div id="modalList"></div>
    <button onclick="closeManageModal()" style="margin-top:12px;">Close</button>
</div>

{% endblock %}


{% block scripts %}
<script>
function openManageModal(typeName) {
    document.getElementById("modalOverlay").style.display = "block";
    const modal = document.getElementById("manageModal");
    modal.style.display = "block";

    const list = document.getElementById("modalList");
    const title = document.getElementById("modalTitle");

    title.innerText = "Manage " + typeName.toUpperCase();
    list.innerHTML = "";

    fetch("/get_options/" + typeName)
        .then(res => res.json())
        .then(data => {
            data.forEach(value => {
                list.innerHTML += `
                    <div>
                        <span>${value}</span>
                        <span>
                            <button onclick="editOption('${typeName}', '${value}')">Edit</button>
                            <button onclick="deleteOption('${typeName}', '${value}')">Delete</button>
                        </span>
                    </div>`;
            });
        });
}

function closeManageModal() {
    document.getElementById("modalOverlay").style.display = "none";
    document.getElementById("manageModal").style.display = "none";
}

function editOption(typeName, oldValue) {
    const newValue = prompt("Enter new value:", oldValue);
    if (!newValue) return;

    fetch("/edit_option", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: typeName, old: oldValue, new: newValue })
    }).then(() => location.reload());
}

function deleteOption(typeName, value) {
    if (!confirm("Delete '" + value + "'?")) return;

    fetch("/delete_option", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: typeName, value })
    }).then(() => location.reload());
}
</script>

<!-- Serial Number Script -->
<script>
(function () {
    const coilSelect = document.getElementById('coil');
    const serialNumInput = document.getElementById('serial_num');

    const initialCounters = {{ counters|tojson }};

    function generateSerialNum() {
        const coilValue = coilSelect.value;

        if (!coilValue || coilValue === "__add_new__") return;

        const tpCoil = coilValue.charAt(0).toUpperCase();
        const year = new Date().getFullYear().toString().slice(-2);

        let last = initialCounters[tpCoil] || 0;
        last += 1;
        initialCounters[tpCoil] = last;

        const serial = String(last).padStart(5, '0');

        const code = `${tpCoil}-010-${serial}-${year}`;

        serialNumInput.value = code;
    }

    coilSelect.addEventListener('change', generateSerialNum);
})();
</script>

{% endblock %}
