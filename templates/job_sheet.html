<!DOCTYPE html>
<html>
<head>
<title>Job Sheet</title>

<style>
    body {
        background: #F8F5E9;
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
        color: #000;
    }

    .sheet-container {
        width: 97%;
        border: 2px solid black;
        padding: 25px;
    }

    .serial {
        font-size: 55px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 30px;
        letter-spacing: 3px;
    }

    .coil-desc {
        font-size: 38px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
    }

    .line {
        width: 100%;
        height: 2px;
        background: black;
        margin: 20px 0;
    }

    .row {
        display: flex;
        justify-content: space-between;
        width: 100%;
        font-size: 22px;
        margin: 6px 0;
    }

    .row div {
        flex: 1;
    }

    .row div:nth-child(2) {
        text-align: center;
    }

    .row div:nth-child(3) {
        text-align: right;
    }

    .title {
        font-weight: bold;
        text-decoration: underline;
    }

    table {
        width: 100%;
        margin-top: 20px;
        font-size: 24px;
    }

    td {
        padding: 10px 0;
    }

    .col-title {
        font-weight: bold;
        text-decoration: underline;
    }

</style>
</head>

<body>

<div class="sheet-container">

    <!-- SERIAL NUMBER -->
    <div class="serial">{{ r.serial_num }}</div>

    <!-- ITEM DESCRIPTION -->
    <div class="coil-desc">
        {{ r.item_desc }} COIL {{ r.thickness }} MM X {{ r.width }} MM
    </div>

    <div class="line"></div>

    <!-- SUPPLIER / DC NO / DC DATE -->
    <div class="row">
        <div>{{ r.supplier_name }}</div>

        <div>
            <span class="title">DC No</span><br>
            {{ r.dc_num }}
        </div>

        <div>
            <span class="title">DC Date</span><br>
            {{ r.date_time.strftime('%d/%m/%Y') }}
        </div>
    </div>

    <div class="line"></div>

    <!-- BATCH / MANUF CODE / WEIGHT / HARDNESS SECTION -->
    <table>
        <tr>
            <td class="col-title">Batch No</td>
            <td class="col-title">Manufacture Code</td>
            <td class="col-title">Weight</td>
            <td class="col-title">Hardness</td>
        </tr>

        <tr>
            <td>{{ r.batchNo }}</td>
            <td>{{ r.manufcode }}</td>
            <td>{{ "{:,}".format(r.weight) }}</td>
            <td>{{ r.hardness }}</td>
        </tr>
    </table>

</div>

</body>
</html>
